# Secure MQTT listener (TLS required)
listener 8883

# Certificate paths
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# Enable TLSv1.2 and TLSv1.3 CSO required
tls_version tlsv1.2

# Enforce client certificate authentication
require_certificate true
use_identity_as_username true  # Uses CN from client certificate as username

# Disable username/password authentication (only TLS)
allow_anonymous false

# Ensure long-lived connections
max_keepalive 3600
persistent_client_expiration 30d

# Log file location
log_dest file /mosquitto/log/mosquitto.log

# Persistence settings
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db

# Autosave interval
autosave_interval 1800

# Logging verbosity
log_type error
log_type warning
log_type notice
log_type information