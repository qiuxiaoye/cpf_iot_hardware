version: '3'
services:
  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto-iot
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - /home/IoT/mosquitto/data:/mosquitto/data
      - /home/IoT/mosquitto/log:/mosquitto/log
    restart: unless-stopped
    networks:
      - mqtt-network

  paho_mqtt:
    build: ./paho_mqtt
    container_name: paho_mqtt_runner
    depends_on:
      - mosquitto
    networks:
      - mqtt-network
    restart: unless-stopped

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt
    container_name: zigbee2mqtt-iot
    ports:
      - "8080:8080"
    volumes:
      - /home/IoT/zigbee2mqtt/data:/app/data
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    environment:
      - TZ=Asia/Singapore
    restart: unless-stopped
    depends_on:
      - mosquitto
    networks:
      - mqtt-network

  # homeassistant:
  #   container_name: home-assistant
  #   image: homeassistant/raspberrypi4-homeassistant:stable
  #   ports:
  #     - "8123:8123"
  #   volumes:
  #     - /home/xiaoye/home-assistant/config:/config
  #   environment:
  #     - TZ=Asia/Singapore
  #   network_mode: host
  #   depends_on:
  #     - zigbee2mqtt
  #   restart: always

networks:
  mqtt-network:
    driver: bridge
