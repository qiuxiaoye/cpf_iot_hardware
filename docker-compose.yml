services:
  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto-iot
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped
    environment:
      - TZ=Asia/Singapore
    networks:
      - mqtt-network

  paho_mqtt:
    build: ./paho_mqtt  # Directory containing Dockerfile and paho_mqtt.py
    container_name: paho_mqtt_runner
    depends_on:
      - mosquitto
    networks:
      - mqtt-network
    restart: unless-stopped

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt
    container_name: zigbee2mqtt-iot
    ports:
      - "8080:8080"
    volumes:
      - ./zigbee2mqtt/data/configuration.yaml:/app/data/configuration.yaml
      - ./zigbee2mqtt/log:/app/data/log
      # - ./zigbee2mqtt/log:/app/log
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    environment:
      - TZ=Asia/Singapore
    restart: unless-stopped
    depends_on:
      - mosquitto
    networks:
      - mqtt-network

  # homeassistant:
  #   container_name: home-assistant
  #   image: homeassistant/raspberrypi4-homeassistant:stable
  #   ports:
  #     - "8123:8123"
  #   volumes:
  #     - /home/xiaoye/home-assistant/config:/config
  #   environment:
  #     - TZ=Asia/Singapore
  #   network_mode: host
  #   depends_on:
  #     - zigbee2mqtt
  #   restart: always

networks:
  mqtt-network:
    driver: bridge
